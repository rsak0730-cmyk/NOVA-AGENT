name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAgent-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Direct APK for Release
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/NovaAgent-v2.0.1.apk \;

      - name: Create or Update GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.1
          name: "Nova Agent v2.0.1 - Direct APK Download"
          body: |
            ### 🚀 Nova Agent v2.0.1 (Direct Install APK)
            **Direct APK Download (No unzipping required)**
            Download `NovaAgent-v2.0.1.apk` below directly to your device and tap it to install.
            
            #### What's New in v2.0.1:
            - **Persistent Floating Dynamic Island**: Always visible over all apps like iOS (`SYSTEM_ALERT_WINDOW`). Displays live agent actions.
            - **Tap Island to Listen**: Single-tap the floating island pill anytime to start/stop voice listening with Jarvis. Long-press opens Nova Agent.
            - **Real-Time Island Settings**: Geometry, X/Y offsets, width, height, corner radius, and animation physics adjust the floating overlay immediately.
            - **Jarvis Conversational Intelligence**: Natural conversational understanding with automatic model fallback (supporting `gemini-3.1-flash-lite`, `gemini-2.0-flash`, etc.) and offline Jarvis voice commands.
            - **Dynamic Keyboard / IME Insets in Chat**: Chat typing bar moves up smoothly above the keyboard so you can see what you are typing.
            - **Shimmer Text Animations**: All 10 text styling effects now feature continuous animated light-sweep shimmer.
            - **Live Mobile Voicemail Guardian**: Add your real mobile phone number. Incoming calls ringing > 20s unanswered are automatically answered by Nova Agent, prompting callers to leave a voicemail and recording/transcribing them.
          files: release-apk/NovaAgent-v2.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
