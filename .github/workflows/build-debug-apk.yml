name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAgent-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Direct APK for Release
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/NovaAgent-v2.0.6.apk \;

      - name: Create or Update GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.6
          name: "Nova Agent v2.0.6 - Direct APK Download"
          body: |
            ### 🚀 Nova Agent v2.0.6 (Direct Install APK)
            **Direct APK Download (No unzipping required)**
            Download `NovaAgent-v2.0.6.apk` below directly to your device and tap it to install.
            
            #### What's New & Upgraded in v2.0.6:
            - **⚡ Shizuku Zero-Touch Autonomous App Control**:
              - Integrated official Shizuku API (`dev.rikka.shizuku:api` & `provider`).
              - Controls ALL Android apps with ADB-level privileges without a single touch from the user.
              - Autonomous primitives: tap coordinates, swipe/scroll media (Shorts, Reels, TikTok), type text into search inputs, press Back/Home/Recents keys, and inspect on-screen UI elements via `uiautomator`.
              - Dedicated Shizuku status badge and authorization card in Settings with automatic fallback to Accessibility Service when Shizuku is offline.
            - **🎙️ Always-On 'Hey Jarvis' Wake Word (Hands-Free Background Detection)**:
              - Say *"Hey Jarvis wake up"* or *"Wake up"* from the background or while inside any other app to turn on Jarvis listening mode hands-free!
              - Say *"Hey Jarvis turn off"*, *"Turn off"*, or *"Go to sleep"* to deactivate listening mode and return Jarvis to quiet standby.
              - Runs 24/7 in the background via the Dynamic Island microphone foreground service (`FOREGROUND_SERVICE_TYPE_MICROPHONE`).
            - **Keyboard-Responsive Chat Box (v2.0.5)**: Input field and controls glide directly atop the soft keyboard with 0 gap and auto-scrolls chat history.
            - **iOS-Style Dynamic Island**: Floating overlay pill over all apps with tap-to-listen toggle.
            - **Physical Volume Up Key Trigger**: Hardware shortcut toggles listening anywhere in the OS.
            - **Real Textured Themes & Universal Shimmer**: 10 procedural textures and universal animated shimmer text.
          files: release-apk/NovaAgent-v2.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
