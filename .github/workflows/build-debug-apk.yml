name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAgent-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Direct APK for Release
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/NovaAgent-v2.0.5.apk \;

      - name: Create or Update GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.5
          name: "Nova Agent v2.0.5 - Direct APK Download"
          body: |
            ### 🚀 Nova Agent v2.0.5 (Direct Install APK)
            **Direct APK Download (No unzipping required)**
            Download `NovaAgent-v2.0.5.apk` below directly to your device and tap it to install.
            
            #### What's Fixed & Upgraded in v2.0.5:
            - **Chat Box Moves Dynamically with User Keyboard**: The typing box (text input field, voice microphone button, and send button) now smoothly glides up directly on top of the virtual keyboard when typing. You can always see what you are writing without the keyboard obscuring it.
            - **Zero Keyboard-Chat Gap**: Mathematically exact inset padding guarantees flush placement on top of the keyboard when open and sits cleanly atop the navigation bar when closed.
            - **Auto-Scroll on Keyboard Open**: Conversation messages automatically scroll up to keep the latest message visible right above the elevated typing box.
            - **Fixed Dynamic Island Tap (100% Reliable Toggle)**: Tapping the Dynamic Island pill reliably toggles voice listening without app switching; you stay on your active screen while talking to Jarvis.
            - **Volume Up Hardware Key Interception**: Pressing Volume Up anywhere reliably triggers voice listening via accessibility service.
            - **Real-Time Active Screen Actions**: Complete active screen control (scrolling, clicking, media play/pause, typing, screen inspection).
            - **Universal Shimmer Text**: All 10 text animation styles feature animated continuous shimmer across all chat messages and screen elements.
            - **Full Voicemail Profile**: Configure user name, mobile SIM number, custom spoken greeting, ring delay slider, and voicemail screening.
          files: release-apk/NovaAgent-v2.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
