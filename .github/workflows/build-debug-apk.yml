name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAgent-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Direct APK for Release
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/NovaAgent-v2.0.2.apk \;

      - name: Create or Update GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.2
          name: "Nova Agent v2.0.2 - Direct APK Download"
          body: |
            ### 🚀 Nova Agent v2.0.2 (Direct Install APK)
            **Direct APK Download (No unzipping required)**
            Download `NovaAgent-v2.0.2.apk` below directly to your device and tap it to install.
            
            #### What's New in v2.0.2:
            - **Real Textured Themes Engine**: Added 10 real, procedural hardware-accelerated physical textures applied across the entire app:
              1. **Carbon Fiber [3D Weave]**: Aerospace diagonal twill-weave carbon fiber with directional light reflection.
              2. **Brushed Titanium**: Anisotropic horizontal metallic brushed striations with specular sheen.
              3. **Hexagon Cyber Mesh**: Honeycomb sci-fi armor mesh with glowing node solder points.
              4. **Circuit Board [Cyber PCB]**: Motherboard micro-bus traces, 45-degree dogleg corners, and glowing via pads.
              5. **Perforated Leather**: Staggered luxury automotive perforated leather with deep shadow cavity and lower specular crescents.
              6. **Obsidian Dark Granite**: Volcanic stone with procedural crystalline mineral flecks.
              7. **Blueprint Technical Grid**: Engineering coordinate drafting grid with precision crosshairs.
              8. **Cosmos Stardust**: Deep space starlight field with cosmic dust nebula and stellar particles.
              9. **Frosted Smoked Glass**: Tactile frosted glass noise grain with refraction streaks.
              10. **Pure OLED Dark**: Ultra-minimal pure pitch dark mode.
            - **Live Interactive Texture Preview**: See a live miniature rendering of each texture in Settings before selecting.
            - **Full Cohesion**: Real textured background renders smoothly under Chat, Voicemail, API Setup, and Settings at 120Hz with zero battery drain.
          files: release-apk/NovaAgent-v2.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
