name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAgent-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Direct APK for Release
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/NovaAgent-v2.0.4.apk \;

      - name: Create or Update GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.4
          name: "Nova Agent v2.0.4 - Direct APK Download"
          body: |
            ### 🚀 Nova Agent v2.0.4 (Direct Install APK)
            **Direct APK Download (No unzipping required)**
            Download `NovaAgent-v2.0.4.apk` below directly to your device and tap it to install.
            
            #### What's Fixed & Upgraded in v2.0.4:
            - **Fixed Dynamic Island Tap (100% Reliable Toggle)**: Tapping the Dynamic Island pill now reliably toggles voice listening without accidental drag interference. Zero app switching; you stay on your active screen while talking to Jarvis.
            - **Microphone Foreground Service Permissions**: Declared `FOREGROUND_SERVICE_MICROPHONE` and `RecognizerIntent.EXTRA_CALLING_PACKAGE` so speech recognition works reliably from overlays and when in background apps on Android 14/15.
            - **Fixed Volume Up Hardware Key Interception**: Added programmatic `FLAG_REQUEST_FILTER_KEY_EVENTS` in `onServiceConnected` and prominent Accessibility status banners so pressing Volume Up anywhere reliably triggers voice listening.
            - **Real-Time Active Screen Actions**:
              - Scrolling: *"Scroll down"*, *"Next video"*, *"Next reel"*, *"Next short"*, *"Scroll up"*.
              - Media: *"Play"*, *"Pause"*, *"Resume"*.
              - Clicking: *"Click [button]"*, *"Tap [text]"* with recursive coordinate gesture tapping.
              - Typing: *"Type [text]"*, *"Search for [text]"* into active inputs.
              - Inspection: *"What is on my screen"*, *"Explain this screen"* with live Watchdog.
              - App launching & dialing: *"Open YouTube"*, *"Call [contact]"*.
            - **Universal Shimmer Text**: All 10 text animation styles feature animated continuous shimmer across all chat messages and screen elements.
            - **Full Voicemail Profile**: Configure user name, mobile SIM number, custom spoken greeting, ring delay slider, guardian toggle, and screening mode.
          files: release-apk/NovaAgent-v2.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
