name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon || gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaAgent-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Direct APK for Release
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/NovaAgent-v2.0.3.apk \;

      - name: Create or Update GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.3
          name: "Nova Agent v2.0.3 - Direct APK Download"
          body: |
            ### 🚀 Nova Agent v2.0.3 (Direct Install APK)
            **Direct APK Download (No unzipping required)**
            Download `NovaAgent-v2.0.3.apk` below directly to your device and tap it to install.
            
            #### What's New in v2.0.3:
            - **Dynamic Island Tap-To-Listen (No App Opening)**: Tapping the floating dynamic island turns on listening mode and directly streams your speech to the agent/chat without switching or opening the app window.
            - **Hardware Volume Up Key Interception**: Added `canRequestFilterKeyEvents` and `flagRequestFilterKeyEvents` so pressing the hardware Volume Up key turns on listening mode and streams speech directly to chat.
            - **Universal Shimmer Text Across Entire App**: All 10 text styles in Text Color / Animation now feature continuous animated shimmer effects, applied across the full app—including both user & agent chat messages, headers, badges, and cards.
            - **Complete User Voicemail Profile**: Added dedicated fields in the Voicemail tab for User/Owner Name, Real Mobile Phone Number, Custom AI Spoken Greeting, Ringing Delay Slider (10s–45s), Guardian Active Toggle, and Screening Mode ("All Callers", "Unknown Only", "Contacts Only").
            - **10 Real Procedural Textured Themes**: Carbon Fiber [3D Weave], Brushed Titanium, Hex Cyber Mesh, Circuit PCB, Perforated Leather, Obsidian Granite, Blueprint, Cosmos Stardust, and Frosted Glass with live previews.
          files: release-apk/NovaAgent-v2.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
